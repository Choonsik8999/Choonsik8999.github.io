<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/navbar.css" type="text/css" />
    <link rel="stylesheet" href="css/common.css" type="text/css" />
    <link rel="stylesheet" href="css/footer.css" type="text/css" />
    <title>IT's KOSTA - register</title>
    <style>
      main {
        padding: 20px 0px; /*상하 좌우*/
      }
      main h1 {
        text-align: center;
        padding: 5px;
      }

      main form {
        height: 350px;
        border: 1px solid gray;
        padding: 40px;
      }

      main .form-item {
        margin-bottom: 10px;
      }

      main .form-item label {
        display: inline-block;
        width: 150px;
        font-size: 18px;
      }

      main .form-item input {
        font-size: 18px;
        border: 1px skyblue solid;
        width: 200px;
      }

      main form button {
        float: right;
        width: 120px;
        font-size: 18px;
        padding: 5px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <!-- 5개의 메뉴생성 -->
        <ul>
          <li class="logo">
            <a href="KOSTABankIndex.html"
              ><img src="images/logo.jpg" alt="로고입니다."
            /></a>
          </li>
          <li><a href="./personal.html">개인</a></li>
          <li><a href="busines.html">기업</a></li>
          <li><a href="login.html">로그인</a></li>
          <li><a href="register.html">회원가입</a></li>
        </ul>
      </nav>
    </header>

    <div id="banner">지금 당신의 행복! IT's KOSTA Life!</div>

    <main>
      <h1>Register</h1>
      <form
        id="registerForm"
        action="KOSTABankIndex.html"
        method="post"
        novalidate
      >
        <div class="form-item">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" autofocus />
        </div>

        <div class="form-item">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" />
        </div>

        <div class="form-item">
          <label for="phone">연락처</label>
          <input type="text" id="phone" name="phone" />
        </div>

        <div class="form-item">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" />
        </div>

        <div class="form-item">
          <label for="password2">비밀번호 확인</label>
          <input type="password" id="password2" name="password2" />
        </div>

        <hr />
        <button type="button" id="registerBtn">회원 가입</button>
      </form>
    </main>

    <footer>
      <ul>
        <li>경기도 성남시 오리역 한국소프트웨어진흥협회</li>
        <li>02-0000-0000</li>
      </ul>
    </footer>
    <script>
      const registerForm = document.querySelector("#registerForm");
      const registerBtn = document.querySelector("#registerBtn");
      // name은 브라우저에 이미 있는 window.name과 겹쳐서 nameInput으로 이름 변경
      const nameInput = document.querySelector("#name");
      const email = document.querySelector("#email");
      const phone = document.querySelector("#phone");
      const password = document.querySelector("#password");
      const password2 = document.querySelector("#password2");

      registerBtn.addEventListener("click", function () {
        // 1) 입력된 내용 콘솔 출력
        console.log(nameInput.value);
        console.log(email.value);
        console.log(phone.value);
        console.log(password.value);
        console.log(password2.value);

        // 2) 입력 유무 체크: 비어 있는 첫 번째 칸에 커서
        const inputs = [nameInput, email, phone, password, password2];
        for (const input of inputs) {
          if (input.value.trim() === "") {
            alert("값을 입력해주세요.");
            input.focus();
            return;
          }
        }

        // 3) 이메일에 '@'가 있는지 체크
        if (!email.value.includes("@")) {
          alert("이메일 형식이 아닙니다.");
          email.focus();
          return;
        }

        // 4) 비밀번호 일치 체크: 틀리면 두 칸 비우고 첫 번째 칸에 커서
        if (password.value !== password2.value) {
          alert("비밀번호가 일치하지 않습니다.");
          password.value = "";
          password2.value = "";
          password.focus();
          return;
        }

        // 5) 모두 통과하면 form의 action(KOSTABankIndex.html)으로 post 전송
        registerForm.submit();
      });
    </script>
  </body>
</html>
