<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>IT's KOSTA - login</title>
    <link rel="stylesheet" href="css/navbar.css" type="text/css" />
    <link rel="stylesheet" href="css/common.css" type="text/css" />
    <link rel="stylesheet" href="css/footer.css" type="text/css" />
    <style>
      main {
        padding: 20px 0px; /*상하 좌우*/
      }
      main h1 {
        text-align: center;
        padding: 5px;
      }

      main form {
        height: 200px;
        border: 1px solid gray;
        padding: 40px;
      }

      main .form-item {
        margin-bottom: 10px;
      }

      main .form-item label {
        display: inline-block;
        width: 100px;
        font-size: 18px;
      }

      main .form-item input {
        font-size: 18px;
        border: 1px skyblue solid;
        width: 200px;
      }

      main form button {
        float: right;
        width: 80px;
        font-size: 18px;
        padding: 5px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <!-- 5개의 메뉴생성 -->
        <ul>
          <li class="logo">
            <a href="KOSTABankIndex.html"
              ><img src="images/logo.jpg" alt="로고입니다."
            /></a>
          </li>
          <li><a href="./personal.html">개인</a></li>
          <li><a href="busines.html">기업</a></li>
          <li><a href="login.html">로그인</a></li>
          <li><a href="register.html">회원가입</a></li>
        </ul>
      </nav>
    </header>

    <div id="banner">지금 당신의 행복! IT's KOSTA Life!</div>

    <main>
      <h1>Login</h1>
      <form action="KOSTABankIndex.html" method="post">
        <div class="form-item">
          <label for="email">이메일</label>
          <input type="text" id="email" name="email" />
        </div>
        <div class="form-item">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" />
        </div>
        <hr />
        <button id="loginBtn">로그인</button>
      </form>
    </main>

    <!-- footer-->
    <footer>
      <ul>
        <li>경기도 성남시 오리역 한국소프트웨어진흥협회</li>
        <li>02-0000-0000</li>
      </ul>
    </footer>
    <script>
      const loginBtn = document.querySelector("#loginBtn");
      const email = document.querySelector("#email");
      const password = document.querySelector("#password");

      loginBtn.addEventListener("click", function (event) {
        // 어떤 경우든 form 전송은 막으므로 맨 앞에서 한 번만 호출
        event.preventDefault();

        console.log(email.value);
        console.log(password.value);

        if (email.value.trim() === "") {
          alert("이메일을 입력해주세요.");
          email.focus();
          return;
        }

        if (password.value.trim() === "") {
          alert("비밀번호를 입력해주세요.");
          password.focus();
          return;
        }

        alert("모든 정보를 입력했습니다.");
      });
    </script>
  </body>
</html>
